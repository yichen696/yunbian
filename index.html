<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f">
<title>云边牧场 · 养殖放置养成</title>
<meta name="description" content="云边牧场是一款单文件放置养成游戏：22 种动物分六个牧场区按秒产金，买动物、升等级、接委托、点研究、转生传承，离线也在产出，进度自动保存在本机浏览器。">
<style>
:root{
  --bg:#f7f1e3; --card:#fffdf7; --ink:#2a2a24; --muted:#7d7666;
  --green:#2f7d4f; --green-d:#22603c; --green-l:#e3f1e4;
  --amber:#c98a24; --amber-l:#f8ebcd; --line:#e7dcc4; --danger:#b2452e;
  --pink:#c94f6d; --pink-l:#fbe6ea;
  --shadow:0 2px 10px rgba(86,70,36,.08); --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);background:linear-gradient(180deg,#faf5e9 0%,#f4ecda 40%,#efe6d1 100%);
  background-attachment:fixed;min-height:100vh;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3,p{margin:0}
.app{max-width:720px;margin:0 auto;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 14px calc(10px + env(safe-area-inset-top,0));
  background:rgba(250,245,233,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;letter-spacing:.5px;white-space:nowrap}
.brand .logo{font-size:19px}
.wallet{display:flex;flex-direction:column;align-items:flex-end;gap:1px;min-width:0}
.coin{display:flex;align-items:center;gap:6px;background:#fff8e6;border:1px solid #eddcb2;border-radius:999px;padding:3px 11px 3px 8px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.coin .coin-ico{font-size:13px}
.wallet-sub{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wallet-sub .dot{margin:0 4px;opacity:.6}
main{padding:12px 14px 8px}
.tab-panel{display:none}
.tab-panel.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 2px 10px}
.panel-head h1{font-size:19px;font-weight:800;letter-spacing:.5px}
.hint{font-size:12px;color:var(--muted);text-align:right}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.species{padding:11px 12px;display:flex;flex-direction:column;gap:9px}
.species.locked{background:#fbf7ee;box-shadow:none}
.sp-top{display:flex;gap:10px;align-items:flex-start}
.sp-emoji{
  flex:0 0 auto;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:25px;
  background:linear-gradient(160deg,#f6eed8,#eadfc2);border:1px solid #e8dcc0;
}
.species.locked .sp-emoji{filter:grayscale(1);opacity:.55}
.sp-meta{flex:1;min-width:0}
.sp-name{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--green-l);color:var(--green-d);border:1px solid #cbe2cd;white-space:nowrap}
.pill.gold{background:var(--amber-l);color:#8a5c10;border-color:#eddcb2}
.pill.grey{background:#f0ece0;color:#8b8474;border-color:#e3dccb}
.pill.pink{background:var(--pink-l);color:#9b3350;border-color:#f2ccd6}
.sp-sub{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.sp-sub b{color:var(--ink);font-weight:700}
.bar{height:5px;border-radius:999px;background:#efe7d5;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#7fbf8c,#2f7d4f);transition:width .18s linear}
.sp-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{
  min-height:44px;border-radius:12px;padding:8px 12px;font-weight:700;font-size:13.5px;
  background:linear-gradient(180deg,#3a8f5c,#2f7d4f);color:#fff;border:1px solid #27673f;
  display:flex;align-items:center;justify-content:center;gap:5px;transition:transform .08s ease;
}
.btn:active{transform:translateY(1px) scale(.995)}
.btn .price{font-weight:600;opacity:.92;font-variant-numeric:tabular-nums}
.btn.ghost{background:#fff;color:var(--green-d);border:1px solid #cfe0cd}
.btn.gold{background:linear-gradient(180deg,#e0ac4b,#c98a24);border-color:#a9741c;color:#fff}
.btn.pink{background:linear-gradient(180deg,#d76a86,#c94f6d);border-color:#a83b55;color:#fff}
.btn.danger{background:linear-gradient(180deg,#c9593e,#b2452e);border-color:#93341f;color:#fff}
.btn.wide{width:100%}
.btn[disabled],.btn.disabled{opacity:.45;filter:grayscale(.35);cursor:not-allowed}
.btn.dim{background:#f2eddf;color:#7d7666;border-color:#e5dcc8}
.area-head{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;font-size:13px;font-weight:800;color:#5f5a4a;letter-spacing:1px}
.area-head .line{flex:1;height:1px;background:var(--line)}
.area-head .cnt{font-weight:600;font-size:11px;color:var(--muted);letter-spacing:0}
.footnote{font-size:11.5px;color:var(--muted);margin:12px 2px 4px;line-height:1.6}
.upgrade{padding:12px;display:flex;flex-direction:column;gap:9px}
.up-actions{display:flex;gap:8px}
.up-actions .btn{flex:1}
/* codex */
.codex{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.codex-item{padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.codex-item.locked{background:#faf6ec;box-shadow:none}
.codex-item .ce{font-size:26px}
.codex-item.locked .ce{filter:grayscale(1);opacity:.4}
.codex-item h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.codex-item p{font-size:11.5px;color:var(--muted);line-height:1.5}
.codex-item .meta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
/* achievements */
.ach-item{padding:11px 12px;display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.ach-item.off{background:#faf7ee;box-shadow:none;opacity:.72}
.ach-ico{width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;font-size:19px;border-radius:11px;background:var(--amber-l);border:1px solid #eddcb2}
.ach-item.off .ach-ico{background:#f1ece0;border-color:#e3dccb;filter:grayscale(1)}
.ach-body{flex:1;min-width:0}
.ach-body h3{font-size:14px;font-weight:700}
.ach-body p{font-size:11.5px;color:var(--muted)}
.ach-flag{font-size:11px;font-weight:700;color:var(--green)}
.ach-item.off .ach-flag{color:#a9a293}
/* orders */
.order{padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.order .o-top{display:flex;gap:10px;align-items:center}
.order .o-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--pink-l);border:1px solid #f0ccd6}
.order .o-body{flex:1;min-width:0}
.order .o-body h3{font-size:14px;font-weight:700}
.order .o-body p{font-size:11.5px;color:var(--muted)}
.order .o-reward{font-size:12px;font-weight:700;color:var(--pink);white-space:nowrap}
.order .o-prog{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.order.done{opacity:.6}
/* research */
.res{padding:12px;display:flex;flex-direction:column;gap:8px}
.res .r-top{display:flex;gap:10px;align-items:flex-start}
.res .r-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--green-l);border:1px solid #cbe2cd}
.res .r-body{flex:1;min-width:0}
.res .r-body h3{font-size:14px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.res .r-body p{font-size:11.5px;color:var(--muted)}
.pips{display:flex;gap:3px;margin-top:6px}
.pips i{width:14px;height:5px;border-radius:3px;background:#e9e2cf}
.pips i.on{background:var(--green)}
/* prestige */
.prestige{padding:14px;display:flex;flex-direction:column;gap:9px;background:linear-gradient(170deg,#fffdf7,#f6f0df)}
.prestige h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px}
.prestige .marks{font-size:13px;color:var(--muted)}
.prestige .marks b{color:var(--pink);font-size:18px}
.mini{font-size:11.5px;color:var(--muted);line-height:1.55}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#fbf7ec;border:1px solid #eee4cf;border-radius:11px;padding:8px 10px}
.stat .k{font-size:11px;color:var(--muted)}
.stat .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;word-break:break-all}
/* tabs */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(255,253,247,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabs button{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:#9a927f;font-weight:600;transition:color .15s ease}
.tabs button span{font-size:18px;line-height:1;filter:grayscale(.45);transition:filter .15s ease}
.tabs button.active{color:var(--green-d)}
.tabs button.active span{filter:none}
/* modal & toast */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(46,40,28,.45);backdrop-filter:blur(3px)}
.modal[hidden]{display:none}
.modal-card{width:100%;max-width:340px;background:var(--card);border-radius:20px;padding:20px;text-align:center;box-shadow:0 14px 40px rgba(40,32,16,.28);border:1px solid #f0e6cd}
.modal-ico{font-size:34px;line-height:1}
.modal-card h2{font-size:17px;margin:6px 0 6px}
.modal-card p{font-size:12.5px;color:var(--muted)}
.gain{font-size:26px;font-weight:800;color:var(--amber);margin:10px 0 6px;font-variant-numeric:tabular-nums;word-break:break-all}
.gain small{font-size:13px;color:var(--muted);font-weight:600;margin-left:4px}
.modal-card .btn{margin-top:14px}
.toast{
  position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:rgba(42,38,28,.93);color:#fff;font-size:12.5px;padding:9px 15px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:50;max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:360px){ .sp-sub{font-size:11.5px} .btn{font-size:12.5px;padding:8px 8px} .stat-grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">🌾</span><span>云边牧场</span></div>
    <div class="wallet">
      <div class="coin"><span class="coin-ico">🪙</span><strong id="coinNum">0</strong></div>
      <div class="wallet-sub"><span id="rateNum">+0/秒</span><span class="dot">·</span><span id="multNum">×1.00</span><span class="dot">·</span><span id="heartNum">💗0</span></div>
    </div>
  </header>

  <main>
    <section class="tab-panel active" data-panel="farm">
      <div class="panel-head">
        <h1>牧场</h1>
        <p class="hint" id="farmHint">22 种动物 · 6 个牧场区</p>
      </div>
      <div id="farmList"></div>
      <p class="footnote">动物每秒自动产金。离线收益默认按 50%、最多 8 小时结算，升级「离线管家」和研究可以再提高。</p>
    </section>

    <section class="tab-panel" data-panel="upgrade">
      <div class="panel-head">
        <h1>升级</h1>
        <p class="hint">全局倍数 · 自动化 · 传承</p>
      </div>
      <div id="feedCard" class="card upgrade"></div>
      <div id="autoList" class="list" style="margin-top:10px"></div>
      <div id="prestigeCard" class="card prestige" style="margin-top:10px"></div>
    </section>

    <section class="tab-panel" data-panel="orders">
      <div class="panel-head">
        <h1>委托</h1>
        <p class="hint" id="orderHint">💗 0 爱心</p>
      </div>
      <div id="orderList" class="list"></div>
      <p class="footnote">委托达成后自动结算爱心，并立刻换成下一单。爱心拿去点「研究」，研究永久生效、传承后也保留。</p>
    </section>

    <section class="tab-panel" data-panel="research">
      <div class="panel-head">
        <h1>研究</h1>
        <p class="hint" id="resHint">💗 0 爱心</p>
      </div>
      <div id="resList" class="list"></div>
      <p class="footnote">研究用爱心升级，不会因为传承而清空，是长线变强的核心。</p>
    </section>

    <section class="tab-panel" data-panel="codex">
      <div class="panel-head">
        <h1>图鉴</h1>
        <p class="hint" id="codexCount">0/22</p>
      </div>
      <div id="codexList" class="codex"></div>
      <div class="area-head" style="margin-top:18px"><span>🏅 成就</span><span class="line"></span><span class="cnt" id="achCount">0/30</span></div>
      <div id="achList" class="list"></div>
      <p class="footnote">每达成一个成就，全局产量 +2%，永久有效。</p>
    </section>
  </main>

  <nav class="tabs" id="tabs">
    <button data-tab="farm" class="active"><span>🌾</span>牧场</button>
    <button data-tab="upgrade"><span>⚡</span>升级</button>
    <button data-tab="orders"><span>📜</span>委托</button>
    <button data-tab="research"><span>🔬</span>研究</button>
    <button data-tab="codex"><span>📖</span>图鉴</button>
  </nav>
</div>

<div class="modal" id="offlineModal" hidden>
  <div class="modal-card">
    <div class="modal-ico">🌙</div>
    <h2>离线收益</h2>
    <p id="offlineLine">你离开了 0 分钟</p>
    <div class="gain"><span id="offlineGain">0</span><small>金币</small></div>
    <p class="mini" id="offlineNote"></p>
    <button class="btn wide" id="btnOfflineOk">收下</button>
  </div>
</div>

<div class="modal" id="prestigeModal" hidden>
  <div class="modal-card">
    <div class="modal-ico">🔥</div>
    <h2>牧场传承</h2>
    <p id="prestigeLine"></p>
    <div class="gain"><span id="prestigeGain">0</span><small>枚印记</small></div>
    <p class="mini" id="prestigeNote"></p>
    <div class="up-actions" style="margin-top:14px">
      <button class="btn ghost" id="btnPrestigeNo">再想想</button>
      <button class="btn pink" id="btnPrestigeYes">确认传承</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" aria-live="polite"></div>
<script>
(function(){
'use strict';

var SAVE_KEY = 'ycy-farm-save-v2';
var SAVE_VER = 2;

var CFG = {
  startCoins: 40,
  maxLevel: 25,
  buyGrowth: 1.155,
  levelStep: 0.35,
  upBase: 0.55,
  upGrowth: 1.57,
  feedMax: 20,
  feedBase: 600,
  feedGrowth: 2.35,
  feedStep: 0.15,
  achBonus: 0.02,
  offlineMinSec: 60,
  offlineCapBase: 8 * 3600,
  offlineCapUp: 12 * 3600,
  offlineEffBase: 0.5,
  offlineEffUp: 1,
  markBonus: 0.02,
  prestigeEarn: 1e12,
  autoBuyEvery: 0.6,
  autoLevelEvery: 1.2,
  orderCount: 3
};

var AREAS = [
  { id:'coop', name:'鸡舍', emoji:'🏠' },
  { id:'meadow', name:'草场', emoji:'🌿' },
  { id:'forest', name:'林地', emoji:'🌳' },
  { id:'pond', name:'水塘', emoji:'💧' },
  { id:'mountain', name:'山地', emoji:'⛰️' },
  { id:'cloud', name:'云端', emoji:'☁️' }
];

var SP_DEF = [
  ['chicken','鸡','🐔','coop','农场的第一声打鸣，天没亮就把所有人叫起来干活。'],
  ['duck','鸭','🦆','coop','一群鸭摇摇摆摆下水，回来时肚子都鼓了。'],
  ['goose','鹅','🦢','coop','看家比狗还凶，生蛋比鸡还勤快。'],

  ['rabbit','兔','🐰','meadow','三瓣嘴一天啃掉半亩苜蓿，窝边的草堆得像小山。'],
  ['pig','猪','🐖','meadow','吃饱就睡，睡醒再吃，长得比谁都快。'],
  ['sheep','羊','🐑','meadow','每年剪两次毛，攒下的够织一整冬的毯子。'],
  ['goat','山羊','🐐','meadow','再陡的坡都上得去，挤出来的奶做奶酪最香。'],

  ['cow','牛','🐄','forest','沉默的老伙计，拉车、挤奶、耕地样样在行。'],
  ['horse','马','🐎','forest','跑一趟镇上，把货带回农场，来回都是钱。'],
  ['donkey','驴','🫏','forest','脾气倔，可是驮得比谁都多。'],
  ['deer','鹿','🦌','forest','林子深处跑出来的，鹿茸一年只有一季。'],

  ['fish','鱼','🐟','pond','挖了三口塘，撒下去的是鱼苗，捞上来的是钱。'],
  ['crab','蟹','🦀','pond','横行霸道，一到秋天价格就翻倍。'],
  ['otter','水獭','🦦','pond','仰躺在水面上啃蚌，顺手帮你把塘里的螺清了。'],

  ['bee','蜂','🐝','mountain','蜂箱一开，整片果园都跟着甜起来。'],
  ['badger','貂','🦡','mountain','夜里出门，白天睡觉，皮毛是山上最贵的。'],
  ['alpaca','羊驼','🦙','mountain','毛比羊毛软，脾气比羊还温顺。'],
  ['peacock','孔雀','🦚','mountain','开屏那一下，游客的钱包也跟着开了。'],

  ['elephant','象','🐘','cloud','一头象能顶半个施工队，木料再也不用人扛。'],
  ['whale','鲸','🐋','cloud','后山水库养出来的怪东西，一口吞下整片鱼群。'],
  ['dragon','龙','🐉','cloud','传说它守着后山的云海，一呼一吸都是收成。'],
  ['phoenix','凤凰','🔥','cloud','在云上盘旋一圈，整座牧场都染上金色。']
];

var CFG_COST_RATIO = 3.3;
var CFG_RATE_RATIO = 2.6;

var SPECIES = SP_DEF.map(function(d, i){
  return {
    id: d[0], name: d[1], emoji: d[2], area: d[3], desc: d[4],
    base: Math.round(10 * Math.pow(CFG_COST_RATIO, i)),
    rate: Math.round(0.5 * Math.pow(CFG_RATE_RATIO, i) * 100) / 100,
    unlock: i === 0 ? null : {
      earn: Math.round(15 * 10 * Math.pow(CFG_COST_RATIO, i)),
      prev: d[3] && SP_DEF[i - 1][0],
      prevN: 3
    }
  };
});

var AUTOS = [
  { id:'autoBuy', name:'自动采购', emoji:'🤖', cost:3000,

/* ---------------- 工具 ---------------- */
function $(sel, root){ return (root || document).querySelector(sel); }
function byId(id){ for (var i=0;i<SPECIES.length;i++) if (SPECIES[i].id===id) return SPECIES[i]; return null; }
function autoById(id){ for (var i=0;i<AUTOS.length;i++) if (AUTOS[i].id===id) return AUTOS[i]; return null; }
function resById(id){ for (var i=0;i<RESEARCH.length;i++) if (RESEARCH[i].id===id) return RESEARCH[i]; return null; }
function speciesInArea(a){ return SPECIES.filter(function(sp){ return sp.area === a; }); }
function areaById(id){ for (var i=0;i<AREAS.length;i++) if (AREAS[i].id===id) return AREAS[i]; return null; }
function clampNum(v, lo, hi){ v = Number(v); if (!isFinite(v)) return lo; return Math.min(hi, Math.max(lo, v)); }

var BIG_U = [[1e28,'穰'],[1e24,'秭'],[1e20,'垓'],[1e16,'京'],[1e12,'兆'],[1e8,'亿'],[1e4,'万']];
function fmt(n){
  if (typeof n !== 'number' || !isFinite(n)) return '∞';
  var neg = n < 0; n = Math.abs(n);
  var out;
  if (n < 1e4) {
    if (n === 0) out = '0';
    else if (n < 10) out = (Math.round(n*100)/100).toFixed(2).replace(/\.?0+$/, '');
    else out = String(Math.floor(n));
  } else {
    out = String(Math.floor(n));
    for (var i=0;i<BIG_U.length;i++){
      var v = BIG_U[i][0];
      if (n >= v){
        var x = n/v;
        out = (x<10 ? x.toFixed(2) : x<100 ? x.toFixed(1) : String(Math.floor(x))) + BIG_U[i][1];
        break;
      }
    }
  }
  if (out === '') out = '0';
  return (neg ? '-' : '') + out;
}
function fmtInt(n){ return Math.floor(n).toLocaleString('zh-CN'); }
function fmtRate(n){
  if (!isFinite(n) || n === 0) return '0';
  if (n < 10) return (Math.round(n*100)/100).toFixed(2).replace(/\.?0+$/, '');
  return fmt(n);
}
function fmtDur(sec){
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return sec + ' 秒';
  var m = Math.floor(sec/60), s = sec%60;
  if (m < 60) return m + ' 分' + (s ? ' ' + s + ' 秒' : '');
  var h = Math.floor(m/60); m = m%60;
  if (h < 24) return h + ' 小时' + (m ? ' ' + m + ' 分' : '');
  var d = Math.floor(h/24); h = h%24;
  return d + ' 天' + (h ? ' ' + h + ' 小时' : '');
}

/* ---------------- 状态 ---------------- */
function newState(){
  var s = {
    v: SAVE_VER,
    coins: CFG.startCoins,
    hearts: 0,
    marks: 0,
    totalEarned: 0,
    feed: 1,
    species: {},
    autos: {},
    research: {},
    ach: {},
    orders: [],
    orderSeq: 1,
    stats: { startedAt: Date.now(), playSec: 0, offlineGain: 0, lastOffline: 0, buys: 0, ups: 0,
             ordersDone: 0, prestiges: 0, heartsEarned: 0, lifetimeEarned: 0 },
    lastSeen: Date.now()
  };
  SPECIES.forEach(function(sp){ s.species[sp.id] = { n:0, lv:1 }; });
  AUTOS.forEach(function(a){ s.autos[a.id] = { owned:false, on:true }; });
  RESEARCH.forEach(function(r){ s.research[r.id] = 0; });
  return s;
}

var state = null;
var autoBuyTimer = 0, autoLevelTimer = 0;

function resLevel(id){ return state && state.research ? (state.research[id] || 0) : 0; }
function resCost(r){
  var lv = resLevel(r.id);
  return Math.ceil(r.base * Math.pow(r.growth, lv));
}
function totalResearch(){
  var t = 0;
  RESEARCH.forEach(function(r){ t += resLevel(r.id); });
  return t;
}
function totalAnimals(){
  var t = 0;
  SPECIES.forEach(function(sp){ t += state.species[sp.id].n; });
  return t;
}
function isUnlocked(sp){
  if (!sp.unlock) return true;
  if (state.totalEarned < sp.unlock.earn) return false;
  var prev = state.species[sp.unlock.prev];
  return !!prev && prev.n >= sp.unlock.prevN;
}
function priceFactor(){ return Math.max(0.8, 1 - 0.04 * resLevel('cheap')); }
function buyCost(sp){
  var n = state.species[sp.id].n;
  return Math.ceil(sp.base * Math.pow(CFG.buyGrowth, n) * priceFactor());
}
function levelStep(){ return CFG.levelStep + 0.035 * resLevel('level'); }
function upCost(sp){
  var lv = state.species[sp.id].lv;
  return Math.ceil(sp.base * CFG.upBase * Math.pow(CFG.upGrowth, lv - 1) * priceFactor());
}
function feedCost(){ return Math.ceil(CFG.feedBase * Math.pow(CFG.feedGrowth, state.feed - 1)); }
function feedMult(){ return 1 + (CFG.feedStep + 0.05 * resLevel('feed')) * (state.feed - 1); }
function achCount(){ var c = 0; ACHS.forEach(function(a){ if (state.ach[a.id]) c++; }); return c; }
function achMult(){ return 1 + CFG.achBonus * achCount(); }
function markMult(){ return 1 + CFG.markBonus * state.marks; }
function resMult(){ return 1 + 0.10 * resLevel('rate'); }
function globalMult(){ return feedMult() * achMult() * markMult() * resMult(); }
function speciesRate(id){
  var sp = byId(id), st = state.species[id];
  return st.n * sp.rate * (1 + levelStep() * (st.lv - 1));
}
function totalRate(){
  var t = 0;
  SPECIES.forEach(function(sp){ t += speciesRate(sp.id); });
  return t * globalMult();
}
function animalRate(sp){ return sp.rate * (1 + levelStep() * (state.species[sp.id].lv - 1)) * globalMult(); }
function startCoins(){ return Math.round(CFG.startCoins * Math.pow(4, resLevel('start'))); }

/* ---------------- 动作 ---------------- */
function pulse(id){
  var card = document.querySelector('.species[data-id="' + id + '"]');
  if (!card) return;
  card.style.transition = 'transform .12s ease';
  card.style.transform = 'scale(1.012)';
  setTimeout(function(){ card.style.transform = ''; }, 120);
}

function buy(id, opts){
  opts = opts || {};
  var sp = byId(id);
  if (!sp || !state) return false;
  if (!isUnlocked(sp)){ if (!opts.silent) toast('还没解锁「' + sp.name + '」'); return false; }
  var cost = buyCost(sp);
  if (state.coins < cost){
    if (!opts.silent) toast('金币不够，再等 ' + fmtDur((cost - state.coins) / Math.max(totalRate(), 0.0001)));
    return false;
  }
  state.coins -= cost;
  state.species[id].n += 1;
  state.stats.buys += 1;
  if (!opts.silent){ pulse(id); toast('买下 1 只' + sp.name + '，花费 ' + fmt(cost)); }
  checkAch();
  if (!opts.silent) renderAll();
  return true;
}

function upgrade(id, opts){
  opts = opts || {};
  var sp = byId(id);
  if (!sp || !state) return false;
  var st = state.species[id];
  if (!isUnlocked(sp)){ if (!opts.silent) toast('还没解锁「' + sp.name + '」'); return false; }
  if (st.lv >= CFG.maxLevel){ if (!opts.silent) toast(sp.name + '已经是满级 Lv.' + CFG.maxLevel); return false; }
  var cost = upCost(sp);
  if (state.coins < cost){ if (!opts.silent) toast('金币不够升级，还差 ' + fmt(cost - state.coins)); return false; }
  state.coins -= cost;
  st.lv += 1;
  state.stats.ups += 1;
  if (!opts.silent){ pulse(id); toast(sp.name + ' 升到 Lv.' + st.lv + '，花费 ' + fmt(cost)); }
  checkAch();
  if (!opts.silent) renderAll();
  return true;
}

function buyFeed(){
  if (state.feed >= CFG.feedMax){ toast('饲料已经满级'); return false; }
  var cost = feedCost();
  if (state.coins < cost){ toast('金币不够，还差 ' + fmt(cost - state.coins)); return false; }
  state.coins -= cost;
  state.feed += 1;
  toast('饲料升到 Lv.' + state.feed + '，全局产量 ×' + feedMult().toFixed(2));
  checkAch(); renderAll();
  return true;
}

function buyAuto(id){
  var a = autoById(id);
  if (!a) return false;
  if (state.autos[id].owned){ toast(a.name + '已经买过了'); return false; }
  if (state.coins < a.cost){ toast('金币不够，还差 ' + fmt(a.cost - state.coins)); return false; }
  state.coins -= a.cost;
  state.autos[id].owned = true;
  state.autos[id].on = true;
  toast('已启用 ' + a.name);
  checkAch(); renderAll();
  return true;
}

function toggleAuto(id){
  var st = state.autos[id];
  if (!st || !st.owned) return false;
  st.on = !st.on;
  toast(autoById(id).name + (st.on ? ' 已开启' : ' 已暂停'));
  renderUpgrades();
  return true;
}

function buyResearch(id){
  var r = resById(id);
  if (!r) return false;
  var lv = resLevel(id);
  if (lv >= r.max){ toast(r.name + '已经满级'); return false; }
  var cost = resCost(r);
  if (state.hearts < cost){ toast('爱心不够，还差 ' + (cost - state.hearts) + ' 💗'); return false; }
  state.hearts -= cost;
  state.research[id] = lv + 1;
  toast(r.name + ' 升到 Lv.' + (lv + 1));
  checkAch(); renderAll();
  return true;
}

function bestBuyTarget(){
  var best = null;
  SPECIES.forEach(function(sp){
    if (!isUnlocked(sp)) return;
    var cost = buyCost(sp);
    if (cost > state.coins) return;
    var score = animalRate(sp) / cost;
    if (!best || score > best.score) best = { sp: sp, score: score };
  });
  return best ? best.sp : null;
}

function bestUpTarget(){
  var best = null;
  SPECIES.forEach(function(sp){
    var st = state.species[sp.id];
    if (!isUnlocked(sp) || st.lv >= CFG.maxLevel) return;
    var cost = upCost(sp);
    if (cost > state.coins) return;
    var gain = st.n * sp.rate * levelStep() * globalMult();
    if (gain <= 0) return;
    var score = gain / cost;
    if (!best || score > best.score) best = { sp: sp, score: score };
  });
  return best ? best.sp : null;
}

/* ---------------- 委托 ---------------- */
function orderMult(){ return 1 + 0.2 * resLevel('order'); }
function orderReward(){
  var base = 8 + 4 * Math.log10(1 + state.totalEarned / 1e3);
  return Math.max(5, Math.round(base * orderMult()));
}
function makeOrder(){
  var pool = SPECIES.filter(isUnlocked);
  var kinds = ['own', 'rate', 'coins', 'level'];
  var kind = kinds[Math.floor(Math.random() * kinds.length)];
  var reward = orderReward();
  var desc = '', sp = null, target = 0;
  if (kind === 'rate'){
    target = Math.max(5, totalRate() * 3);
    desc = '每秒产出达到 ' + fmtRate(target) + '/秒';
  } else if (kind === 'coins'){
    target = Math.max(200, totalRate() * 120);
    desc = '手上同时持有 ' + fmt(target) + ' 金币';
  } else if (kind === 'level'){
    var cands = pool.filter(function(x){ return state.species[x.id].lv < CFG.maxLevel; });
    if (cands.length){
      sp = cands[Math.floor(Math.random() * cands.length)];
      target = Math.min(CFG.maxLevel, state.species[sp.id].lv + 1 + Math.floor(Math.random() * 3));
      desc = '把' + sp.name + '养到 Lv.' + target;
    } else {
      kind = 'own';
    }
  }
  if (kind === 'own'){
    sp = pool[Math.floor(Math.random() * pool.length)];
    var n = state.species[sp.id].n;
    target = n + Math.max(3, Math.ceil(n * 0.15));
    desc = '养到 ' + target + ' 只' + sp.name;
  }
  return { id: state.orderSeq++, kind: kind, sp: sp ? sp.id : null, target: target, reward: reward, desc: desc };
}
function ensureOrders(){
  while (state.orders.length < CFG.orderCount) state.orders.push(makeOrder());
}
function orderDone(o){
  if (o.kind === 'own') return state.species[o.sp].n >= o.target;
  if (o.kind === 'rate') return totalRate() >= o.target;
  if (o.kind === 'coins') return state.coins >= o.target;
  if (o.kind === 'level') return state.species[o.sp].lv >= o.target;
  return false;
}
function orderProgress(o){
  var now = 0;
  if (o.kind === 'own') now = state.species[o.sp].n;
  else if (o.kind === 'rate') now = totalRate();
  else if (o.kind === 'coins') now = state.coins;
  else if (o.kind === 'level') now = state.species[o.sp].lv;
  return { now: now, pct: Math.max(0, Math.min(1, o.target > 0 ? now / o.target : 0)) };
}
function checkOrders(){
  if (!state.orders || !state.orders.length) return;
  for (var i = 0; i < state.orders.length; i++){
    var o = state.orders[i];
    if (orderDone(o)){
      state.hearts += o.reward;
      state.stats.heartsEarned += o.reward;
      state.stats.ordersDone += 1;
      toast('📜 委托完成：' + o.desc + ' · +' + o.reward + ' 爱心');
      state.orders[i] = makeOrder();
    }
  }
}

/* ---------------- 传承 ---------------- */
function potentialMarks(){ return Math.floor(Math.sqrt(Math.max(0, state.totalEarned) / CFG.prestigeEarn)); }
function marksAvailable(){
  var raw = Math.floor(potentialMarks() * (1 + 0.25 * resLevel('mark')));
  return Math.max(0, raw - state.marks);
}
function canPrestige(){ return marksAvailable() >= 1; }
function doPrestige(){
  if (!canPrestige()) return false;
  var gain = marksAvailable();
  state.marks += gain;
  state.stats.prestiges += 1;
  state.coins = startCoins();
  state.totalEarned = 0;
  state.feed = 1;
  SPECIES.forEach(function(sp){ state.species[sp.id] = { n: 0, lv: 1 }; });
  state.orders = [];
  state.orderSeq = 1;
  ensureOrders();
  checkAch();
  save(); renderAll(); switchTab('farm');
  toast('🔥 传承完成：+' + gain + ' 枚印记（全局产量 ×' + markMult().toFixed(2) + '）');
  return true;
}

/* ---------------- 成就 ---------------- */
function checkAch(){
  var got = false;
  for (var i = 0; i < ACHS.length; i++){
    var a = ACHS[i];
    if (state.ach[a.id]) continue;
    var ok = false;
    try { ok = !!a.cond(state); } catch (e) { ok = false; }
    if (ok){ state.ach[a.id] = true; got = true; toast('🏅 成就达成：' + a.name); }
  }
  return got;
}

/* ---------------- 存档 ---------------- */
function save(){
  if (!state) return false;
  try {
    state.lastSeen = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    return true;
  } catch (e) { return false; }
}

function normalize(src){
  if (!src || typeof src !== 'object') throw new Error('存档结构不对');
  if (typeof src.coins !== 'number' || !isFinite(src.coins) || src.coins < 0) throw new Error('金币数据不对');
  var s = newState();
  s.coins = src.coins;
  s.hearts = Math.max(0, Number(src.hearts) || 0);
  s.marks = Math.max(0, Number(src.marks) || 0);
  s.totalEarned = Math.max(0, Number(src.totalEarned) || 0);
  s.feed = Math.floor(clampNum(src.feed, 1, CFG.feedMax));
  if (src.species && typeof src.species === 'object'){
    SPECIES.forEach(function(sp){
      var x = src.species[sp.id];
      if (x && typeof x === 'object'){
        s.species[sp.id] = {
          n: Math.floor(clampNum(x.n, 0, 1e8)),
          lv: Math.floor(clampNum(x.lv, 1, CFG.maxLevel))
        };
      }
    });
  }
  if (src.autos && typeof src.autos === 'object'){
    AUTOS.forEach(function(a){
      var x = src.autos[a.id];
      if (x && typeof x === 'object') s.autos[a.id] = { owned: !!x.owned, on: x.on !== false };
    });
  }
  if (src.research && typeof src.research === 'object'){
    RESEARCH.forEach(function(r){ s.research[r.id] = Math.floor(clampNum(src.research[r.id], 0, r.max)); });
  }
  if (src.ach && typeof src.ach === 'object'){
    ACHS.forEach(function(a){ if (src.ach[a.id] === true) s.ach[a.id] = true; });
  }
  if (src.stats && typeof src.stats === 'object'){
    var st = src.stats;
    s.stats.startedAt = Number(st.startedAt) || Date.now();
    ['playSec','offlineGain','lastOffline','buys','ups','ordersDone','prestiges','heartsEarned','lifetimeEarned'].forEach(function(k){
      s.stats[k] = Math.max(0, Number(st[k]) || 0);
    });
    s.stats.lifetimeEarned = Math.max(s.stats.lifetimeEarned, s.totalEarned);
  }
  if (Array.isArray(src.orders)){
    src.orders.forEach(function(o){
      if (!o || typeof o !== 'object') return;
      var kind = ['own','rate','coins','level'].indexOf(o.kind) >= 0 ? o.kind : 'rate';
      var sp = o.sp && byId(o.sp) ? o.sp : null;
      if ((kind === 'own' || kind === 'level') && !sp) return;
      var target = Number(o.target);
      if (!isFinite(target) || target <= 0) return;
      s.orders.push({ id: s.orderSeq++, kind: kind, sp: sp, target: target, reward: Math.max(1, Number(o.reward) || 10), desc: String(o.desc || '委托') });
    });
  }
  if (s.orders.length > CFG.orderCount) s.orders.length = CFG.orderCount;
  s.lastSeen = (typeof src.lastSeen === 'number' && isFinite(src.lastSeen)) ? src.lastSeen : Date.now();
  s.v = SAVE_VER;
  return s;
}

function offlineCalc(gapSec){
  var up = !!(state.autos && state.autos.offlineMgr && state.autos.offlineMgr.owned);
  var cap = (up ? CFG.offlineCapUp : CFG.offlineCapBase) + 7200 * resLevel('cap');
  var eff = (up ? CFG.offlineEffUp : CFG.offlineEffBase) + 0.1 * resLevel('offline');
  var used = Math.min(Math.max(0, gapSec), cap);
  return { gap: gapSec, used: used, cap: cap, eff: eff, capped: gapSec > cap + 1, gained: totalRate() * used * eff };
}

var pendingOffline = null;

function load(){
  var raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) {}
  var loaded = null;
  if (raw){
    try { loaded = normalize(JSON.parse(raw)); } catch (e) { loaded = null; }
  }
  state = loaded || newState();
  ensureOrders();
  var gap = loaded ? (Date.now() - (loaded.lastSeen || Date.now())) / 1000 : 0;
  if (gap >= CFG.offlineMinSec){
    var info = offlineCalc(gap);
    state.coins += info.gained;
    state.totalEarned += info.gained;
    state.stats.lifetimeEarned += info.gained;
    state.stats.offlineGain += info.gained;
    state.stats.lastOffline = info.gained;
    state.lastSeen = Date.now();
    pendingOffline = info;
  }
  checkAch();
  renderAll();
  if (pendingOffline) showOffline(pendingOffline);
  return { loaded: !!loaded, gap: gap, offline: pendingOffline };
}

/* ---------------- 主循环 ---------------- */
function tick(dt){
  if (!state || !(dt > 0)) return;
  var gain = totalRate() * dt;
  state.coins += gain;
  state.totalEarned += gain;
  state.stats.lifetimeEarned += gain;
  state.stats.playSec += dt;

  var buyEvery = CFG.autoBuyEvery * (1 - 0.15 * resLevel('auto'));
  if (state.autos.autoBuy.owned && state.autos.autoBuy.on){
    autoBuyTimer += dt;
    var guard = 0;
    while (autoBuyTimer >= buyEvery && guard++ < 50){
      autoBuyTimer -= buyEvery;
      var tb = bestBuyTarget();
      if (!tb){ autoBuyTimer = 0; break; }
      buy(tb.id, { silent: true });
    }
  } else { autoBuyTimer = 0; }

  if (state.autos.autoLevel.owned && state.autos.autoLevel.on){
    autoLevelTimer += dt;
    var guard2 = 0;
    while (autoLevelTimer >= CFG.autoLevelEvery && guard2++ < 50){
      autoLevelTimer -= CFG.autoLevelEvery;
      var tu = bestUpTarget();
      if (!tu){ autoLevelTimer = 0; break; }
      upgrade(tu.id, { silent: true });
    }
  } else { autoLevelTimer = 0; }

  checkOrders();
  checkAch();
}

var saveTimer = 0;
var lastTick = Date.now();

function loop(){
  var now = Date.now();
  var dt = (now - lastTick) / 1000;
  lastTick = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 180) dt = 180;
  tick(dt);
  saveTimer += dt;
  if (saveTimer >= 5){ saveTimer = 0; save(); }
  tickUI();
}

var toastQueue = [], toastBusy = false;
function toast(msg){
  toastQueue.push(String(msg));
  if (!toastBusy) runToast();
}
function runToast(){
  var msg = toastQueue.shift();
  if (msg === undefined){ toastBusy = false; return; }
  toastBusy = true;
  var box = $('#toast');
  box.textContent = msg;
  box.classList.add('show');
  setTimeout(function(){
    box.classList.remove('show');
    setTimeout(runToast, 200);
  }, 1500);
}

  for (var i = 0; i < panels.length; i++) panels[i].classList.toggle('active', panels[i].getAttribute('data-panel') === name);

}

});
